name: CORTEX-BTC Hourly Pipeline

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cortex-btc-pipeline
  cancel-in-progress: false

jobs:
  cortex-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live BTC, macro & on-chain telemetry
        run: python btc_data_fetcher.py

      - name: Run CORTEX-BTC v3.0 Matrix Engine
        run: python cortex_matrix_engine.py

      - name: Export static GitHub Pages viewer
        run: python export_github_pages.py

      - name: Dispatch Telegram Mobile HUD Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_cortex_alert.py

      - name: Commit telemetry and verdict JSONs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_metrics_latest.json cortex_verdict_latest.json docs/index.html docs/market_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(cortex): update hourly telemetry, verdict & pages"
            git push
          fi
